<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">A pelican flying on a red bicycle</title>
  <desc id="desc">An animated cartoon: a pelican with a big orange beak rides a red bicycle through the sky, wings flapping, wheels spinning, bobbing gently above green hills while clouds drift past.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe6f9"/>
      <stop offset="100%" stop-color="#eef7fb"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- sun with slowly turning rays -->
  <g>
    <circle cx="112" cy="96" r="46" fill="#ffd66b" opacity="0.9"/>
    <circle cx="112" cy="96" r="62" fill="#ffd66b" opacity="0.18"/>
    <g stroke="#ffd66b" stroke-width="6" stroke-linecap="round" opacity="0.55">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 112 96" to="360 112 96" dur="50s" repeatCount="indefinite"/>
      <line x1="112" y1="22" x2="112" y2="36"/>
      <line x1="112" y1="156" x2="112" y2="170"/>
      <line x1="38" y1="96" x2="52" y2="96"/>
      <line x1="172" y1="96" x2="186" y2="96"/>
      <line x1="60" y1="44" x2="70" y2="54"/>
      <line x1="154" y1="138" x2="164" y2="148"/>
      <line x1="164" y1="44" x2="154" y2="54"/>
      <line x1="70" y1="138" x2="80" y2="148"/>
    </g>
  </g>

  <!-- clouds, drifting gently -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 28 0; 0 0" keyTimes="0;0.5;1"
                        calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
                        dur="16s" repeatCount="indefinite"/>
      <circle cx="590" cy="92" r="26"/>
      <circle cx="622" cy="84" r="34"/>
      <circle cx="658" cy="96" r="24"/>
      <rect x="590" y="92" width="70" height="26" rx="13"/>
    </g>
    <g opacity="0.75">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; -22 0; 0 0" keyTimes="0;0.5;1"
                        calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
                        dur="21s" repeatCount="indefinite"/>
      <circle cx="252" cy="66" r="18"/>
      <circle cx="276" cy="60" r="24"/>
      <circle cx="300" cy="70" r="16"/>
      <rect x="252" y="66" width="50" height="18" rx="9"/>
    </g>
    <g opacity="0.6">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 18 0; 0 0" keyTimes="0;0.5;1"
                        calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
                        dur="25s" repeatCount="indefinite"/>
      <circle cx="700" cy="210" r="16"/>
      <circle cx="722" cy="204" r="22"/>
      <circle cx="744" cy="212" r="14"/>
      <rect x="700" y="210" width="46" height="16" rx="8"/>
    </g>
  </g>

  <!-- distant hills -->
  <path d="M0,600 L0,540 Q120,500 240,536 Q360,572 470,532 Q590,490 700,530 Q760,550 800,538 L800,600 Z"
        fill="#cfe3c6"/>
  <path d="M0,600 L0,576 Q140,548 280,574 Q420,600 560,568 Q700,540 800,572 L800,600 Z"
        fill="#b3d1a6"/>

  <!-- far-below shadow, showing the bird is up in the air -->
  <ellipse cx="410" cy="584" rx="190" ry="14" fill="url(#shadow)"/>

  <!-- air streaks rushing past -->
  <g stroke="#8fb8cf" stroke-linecap="round" stroke-width="7" opacity="0.6">
    <path d="M40,270 H300" stroke-dasharray="46 90">
      <animate attributeName="stroke-dashoffset" values="0;136" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <path d="M10,330 H250" stroke-dasharray="34 102">
      <animate attributeName="stroke-dashoffset" values="0;136" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <path d="M60,395 H290" stroke-dasharray="52 84">
      <animate attributeName="stroke-dashoffset" values="0;136" dur="1.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ============ PELICAN + BICYCLE (airborne, bobbing) ============ -->
  <g transform="translate(0,-80)">
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -16; 0 0" keyTimes="0;0.5;1"
                        calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
                        dur="3.2s" repeatCount="indefinite"/>

      <!-- ===== wheels ===== -->
      <!-- rear wheel -->
      <circle cx="250" cy="430" r="92" fill="none" stroke="#2c2c2c" stroke-width="13"/>
      <circle cx="250" cy="430" r="78" fill="none" stroke="#c3cbd3" stroke-width="4"/>
      <g stroke="#b6bfc8" stroke-width="2.5" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate"
                          from="0 250 430" to="360 250 430" dur="1.3s" repeatCount="indefinite"/>
        <line x1="250" y1="352" x2="250" y2="508"/>
        <line x1="172" y1="430" x2="328" y2="430"/>
        <line x1="195" y1="375" x2="305" y2="485"/>
        <line x1="305" y1="375" x2="195" y2="485"/>
        <line x1="212" y1="358" x2="288" y2="502"/>
        <line x1="288" y1="358" x2="212" y2="502"/>
        <line x1="176" y1="402" x2="324" y2="458"/>
        <line x1="176" y1="458" x2="324" y2="402"/>
      </g>
      <circle cx="250" cy="430" r="9" fill="#2c2c2c"/>

      <!-- front wheel -->
      <circle cx="560" cy="430" r="92" fill="none" stroke="#2c2c2c" stroke-width="13"/>
      <circle cx="560" cy="430" r="78" fill="none" stroke="#c3cbd3" stroke-width="4"/>
      <g stroke="#b6bfc8" stroke-width="2.5" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate"
                          from="0 560 430" to="360 560 430" dur="1.3s" repeatCount="indefinite"/>
        <line x1="560" y1="352" x2="560" y2="508"/>
        <line x1="482" y1="430" x2="638" y2="430"/>
        <line x1="505" y1="375" x2="615" y2="485"/>
        <line x1="615" y1="375" x2="505" y2="485"/>
        <line x1="522" y1="358" x2="598" y2="502"/>
        <line x1="598" y1="358" x2="522" y2="502"/>
        <line x1="486" y1="402" x2="634" y2="458"/>
        <line x1="486" y1="458" x2="634" y2="402"/>
      </g>
      <circle cx="560" cy="430" r="9" fill="#2c2c2c"/>

      <!-- ===== red frame ===== -->
      <g fill="none" stroke="#c0392b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
        <path d="M250,430 L390,430"/>
        <path d="M250,430 L352,318"/>
        <path d="M390,430 L352,318"/>
        <path d="M390,430 L540,352"/>
        <path d="M352,318 L522,306"/>
        <path d="M540,352 L522,306"/>
        <path d="M540,352 L560,430"/>
      </g>

      <!-- chainring, crank, pedals -->
      <circle cx="390" cy="430" r="26" fill="none" stroke="#6b7680" stroke-width="5"/>
      <circle cx="390" cy="430" r="7" fill="#4a545d"/>
      <path d="M250,430 L390,452" stroke="#6b7680" stroke-width="4" opacity="0.8"/>
      <line x1="390" y1="430" x2="416" y2="462" stroke="#4a545d" stroke-width="8" stroke-linecap="round"/>
      <rect x="404" y="458" width="30" height="10" rx="4" fill="#2c2c2c"/>
      <line x1="390" y1="430" x2="364" y2="398" stroke="#4a545d" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
      <rect x="349" y="390" width="30" height="10" rx="4" fill="#2c2c2c" opacity="0.55"/>

      <!-- handlebar -->
      <g fill="none" stroke="#c0392b" stroke-width="10" stroke-linecap="round">
        <path d="M522,306 L546,288"/>
        <path d="M546,288 C572,274 598,286 594,308"/>
      </g>
      <circle cx="594" cy="308" r="9" fill="#2c2c2c"/>

      <!-- saddle -->
      <path d="M312,300 Q350,284 392,298 Q350,310 312,300 Z" fill="#3a3a3a"/>
      <line x1="352" y1="300" x2="356" y2="318" stroke="#4a545d" stroke-width="7" stroke-linecap="round"/>

      <!-- ===== pelican ===== -->

      <!-- far wing, behind the body, flapping -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0 334 224; -20 334 224; 0 334 224; 10 334 224; 0 334 224"
                          keyTimes="0;0.25;0.5;0.75;1" dur="1.6s" repeatCount="indefinite"/>
        <path d="M334,224 C300,192 258,170 206,158 C224,192 224,212 238,240 C276,232 308,242 334,262 Z"
              fill="#e2d7c4" stroke="#d5cab4" stroke-width="4" stroke-linejoin="round"/>
        <g fill="none" stroke="#d5cab4" stroke-width="2.5" opacity="0.8">
          <path d="M252,178 Q272,206 278,236"/>
          <path d="M286,190 Q302,214 306,240"/>
        </g>
      </g>

      <!-- tail feathers -->
      <path d="M268,246 L206,226 L222,256 L198,272 L268,282 Z" fill="#e8dfcd" stroke="#d5cab4" stroke-width="3" stroke-linejoin="round"/>

      <!-- legs -->
      <g stroke-linecap="round" fill="none">
        <path d="M344,300 L378,376 L410,458" stroke="#d98325" stroke-width="15"/>
        <path d="M344,300 L378,376 L410,458" stroke="#f2a03d" stroke-width="9"/>
        <path d="M410,458 L432,462 M410,458 L426,472 M410,458 L396,470" stroke="#f2a03d" stroke-width="7"/>
      </g>

      <!-- body -->
      <ellipse cx="332" cy="248" rx="82" ry="66" transform="rotate(-12 332 248)"
               fill="#faf7f0" stroke="#d5cab4" stroke-width="4"/>
      <ellipse cx="376" cy="272" rx="34" ry="26" transform="rotate(-18 376 272)" fill="#efe8da" opacity="0.8"/>

      <!-- neck -->
      <path d="M382,222 C402,196 412,172 440,156" fill="none" stroke="#d5cab4" stroke-width="46" stroke-linecap="round"/>
      <path d="M382,222 C402,196 412,172 440,156" fill="none" stroke="#faf7f0" stroke-width="38" stroke-linecap="round"/>

      <!-- head -->
      <circle cx="452" cy="142" r="31" fill="#faf7f0" stroke="#d5cab4" stroke-width="4"/>

      <!-- beak -->
      <path d="M472,166 Q548,228 646,168 Q566,196 470,152 Z" fill="#e8912e" stroke="#c9761d" stroke-width="4" stroke-linejoin="round"/>
      <path d="M468,140 L648,158 L646,168 L470,158 Z" fill="#f2a03d" stroke="#c9761d" stroke-width="4" stroke-linejoin="round"/>
      <line x1="482" y1="152" x2="632" y2="163" stroke="#c9761d" stroke-width="2.5" opacity="0.7"/>

      <!-- eye -->
      <circle cx="462" cy="130" r="7" fill="#2c2c2c"/>
      <circle cx="465" cy="127" r="2.4" fill="#ffffff"/>

      <!-- near wing, flapping in front of the body -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0 378 240; -20 378 240; 0 378 240; 12 378 240; 0 378 240"
                          keyTimes="0;0.25;0.5;0.75;1" dur="1.6s" repeatCount="indefinite"/>
        <path d="M378,240 C430,210 492,196 546,204 C532,234 528,250 512,270 C466,258 420,250 378,276 Z"
              fill="#ece4d4" stroke="#d5cab4" stroke-width="4" stroke-linejoin="round"/>
        <g fill="none" stroke="#d5cab4" stroke-width="2.5" opacity="0.9">
          <path d="M414,236 Q474,226 528,220"/>
          <path d="M404,254 Q458,246 508,242"/>
        </g>
      </g>
    </g>
  </g>

  <!-- twinkling sparkles near the beak -->
  <g fill="#ffffff">
    <path d="M690,120 l4,10 10,4 -10,4 -4,10 -4,-10 -10,-4 10,-4 Z" opacity="0.9">
      <animate attributeName="opacity" values="0.15;0.95;0.15" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <path d="M660,70 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 Z" opacity="0.8">
      <animate attributeName="opacity" values="0.9;0.15;0.9" dur="2.3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
